zerops:
  - setup: nodejs
    build:
      base: nodejs@20
      buildCommands:
        - npm i
      deployFiles:
        - ./
    run:
      start: node index.js
      ports:
        - port: 3000
          http:
            routes:
              - port: 3000

  - setup: aiservice
    build:
      base: python@3.12
      deployFiles:
        - main.py
    run:
      start: python3 main.py
      ports:
        - port: 8000
          http:
            routes:
              - port: 8000
              zerops:
  - setup: web
    build:
      base: static
      deployFiles:
        - ./
    run:
      base: static
